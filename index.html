<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e8" />
    <meta
      name="description"
      content="多人協作的旅遊行程、航班、住宿與地點規劃 App"
    />
    <title>旅伴｜多人旅遊規劃</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="./styles.css?v=20260812.8" />
  </head>
  <body>
    <main class="stage">
      <section class="phone" aria-label="多人旅遊規劃 App">
        <div id="app" class="app"></div>
        <nav class="tab-bar" aria-label="主要導覽">
          <button class="tab active" type="button" data-tab="overview">
            <span class="tab-icon">◇</span><span>總覽</span>
          </button>
          <button class="tab" type="button" data-tab="places">
            <span class="tab-icon">●</span><span>地點</span>
          </button>
          <button class="tab" type="button" data-tab="itinerary">
            <span class="tab-icon">□</span><span>行程</span>
          </button>
          <button class="tab" type="button" data-tab="shopping">
            <span class="tab-icon">▱</span><span>購物</span>
          </button>
        </nav>
        <div class="home-indicator" aria-hidden="true"></div>
      </section>
    </main>

    <div id="sheet-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="./app.js?v=20260812.8"></script>
  </body>
</html>
