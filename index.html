<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e8" />
    <meta
      name="description"
      content="東京家庭旅行協作 App 的 V0 可操作原型"
    />
    <title>東京 7 日｜旅遊協作原型</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="phone" aria-label="東京家庭旅行 App 原型">
        <div class="status-bar" aria-hidden="true">
          <span>9:41</span>
          <span class="dynamic-island"></span>
          <span>●●● ◒ ▰</span>
        </div>
        <div id="app" class="app"></div>
        <nav class="tab-bar" aria-label="主要導覽">
          <button class="tab active" type="button" data-tab="overview">
            <span class="tab-icon">◇</span><span>總覽</span>
          </button>
          <button class="tab" type="button" data-tab="places">
            <span class="tab-icon">●</span><span>地點</span>
          </button>
          <button class="tab" type="button" data-tab="itinerary">
            <span class="tab-icon">□</span><span>行程</span>
          </button>
        </nav>
        <div class="home-indicator" aria-hidden="true"></div>
      </section>
    </main>

    <div id="sheet-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
